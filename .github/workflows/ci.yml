name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC 15
            preset: dev-gcc
            compiler: gcc-15
            packages: gcc-15 libc6-dev
            ppa: true
          - name: Clang 18
            preset: dev-clang
            compiler: clang
            packages: clang libclang-rt-18-dev
            ppa: false
    env:
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4

      # Ubuntu 24.04 ships GCC 14; GCC 15 comes from the toolchain PPA.
      - name: Add GCC toolchain PPA
        if: matrix.ppa
        run: sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build ${{ matrix.packages }}

      - name: Configure
        run: >-
          cmake --preset ${{ matrix.preset }}
          -DCMAKE_C_COMPILER=${{ matrix.compiler }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang clang-tidy cppcheck cmake ninja-build

      - name: Configure
        run: cmake --preset analyze

      - name: Analyze
        run: cmake --build --preset analyze

      - name: Test
        run: ctest --preset analyze
